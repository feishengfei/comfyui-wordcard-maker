<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
body {
    width: 1080px;
    height: 1920px;
    background-color: #ffffff;
    font-family: "Noto Sans SC", "Noto Sans JP", "Noto Sans KR", sans-serif;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
}
/* 图片区域固定占上半区 1080x1080 */
.img-wrap {
    width: 1080px;
    height: 1080px;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1;
}
.main-img {
    width: 1080px;
    height: 1080px;
    object-fit: contain;
}
/* 文字区域：高度缩减，增加底部内边距，防止和版权文字重叠 */
.text-container {
    width: 1080px;
    height: 760px;
    padding-bottom: 40px;
    display: flex;
    flex-direction: column;
    justify-content: space-evenly;
    align-items: center;
    z-index: 1;
}
/* 普通单行条目，en_US / zh_CN / ko_KR */
.line {
    width: 100%;
    text-align: center;
    font-weight: 700;
    font-size: 72px;
    color: #222222;
    line-height: 1.3;
}
/* 日语 / 韩语组合容器，整体高度等价于一个 .line */
.line-wrap {
    width:100%;
    display:flex;
    flex-direction: column;
}
.line_main {
    flex: 6;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
    font-size:72px;
    color:#222222;
}
.line_sub {
    flex: 4;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
    font-size:44px;
    color:#555555;
}
/* 底部版权小字 */
.footer-copyright {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 30px;
    text-align: center;
    font-size: 28px;
    color: #999999;
    z-index: 2;
    letter-spacing: 1px;
}
</style>
</head>
<body>
    <div class="img-wrap">
        <img class="main-img" src="{{IMG_BASE64}}">
    </div>
    <div class="text-container">
        <div class="line-wrap">
            <div class="line_main">{{en_US}}</div>
            <div class="line_sub">{{en_US_IPA}}</div>
        </div>
        <div class="line-wrap">
            <div class="line_main">{{zh_CN}}</div>
            <div class="line_sub">{{zh_PY}}</div>
        </div>
        <div class="line-wrap">
            <div class="line_main">{{jp_JP}}</div>
            <div class="line_sub">{{jp_RO}}</div>
        </div>
        <div class="line-wrap">
            <div class="line_main">{{ko_KR}}</div>
            <div class="line_sub">{{ko_RO}}</div>
        </div>
    </div>
    <div class="footer-copyright">Copyright © 2026 文画卷</div>
</body>
</html>
